name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Типы, линт и сборка
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Линт
        run: npm run lint

      - name: Сборка
        run: npm run build

      # Страховка от главной ошибки прошлого деплоя:
      # на прод должен уезжать dist/, а не исходники.
      - name: Проверить, что собран корректный dist
        run: |
          test -f dist/index.html || { echo "Нет dist/index.html"; exit 1; }
          if grep -q "/src/main.tsx" dist/index.html; then
            echo "ОШИБКА: dist/index.html ссылается на исходник /src/main.tsx"
            exit 1
          fi
          test -d dist/assets || { echo "Нет dist/assets"; exit 1; }
          echo "dist собран корректно"

      - name: Сохранить сборку как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
