# ============================================================
#  rrysbekov.ru — конфиг nginx
#  Положить в /etc/nginx/conf.d/rrysbekov.conf  (это контекст http,
#  поэтому map/limit_req_zone здесь объявлять можно)
#  Проверка:  nginx -t && systemctl reload nginx
# ============================================================

# ---------- Лимиты запросов ----------
# Обычные страницы: 10 запросов в секунду на IP, всплеск до 20
limit_req_zone  $binary_remote_addr  zone=site:10m   rate=10r/s;
# Форма обратной связи: 10 запросов в минуту на IP
limit_req_zone  $binary_remote_addr  zone=contact:5m rate=10r/m;
# Не больше 20 одновременных соединений с одного IP
limit_conn_zone $binary_remote_addr  zone=conn:10m;

# ---------- Сканеры и мусорные боты ----------
map $http_user_agent $bad_bot {
    default                                 0;
    ""                                      1;   # пустой User-Agent
    "~*(sqlmap|nikto|nmap|masscan|zgrab)"   1;
    "~*(dirbuster|gobuster|wpscan|havij)"   1;
    "~*(acunetix|nessus|openvas|xrumer)"    1;
    "~*(petalbot|bytespider|dataforseo)"    1;
}

# Кэш статики: имена файлов с хэшем — можно кэшировать навсегда
map $sent_http_content_type $cache_control {
    default                     "public, max-age=3600";
    "~*text/html"               "no-cache, must-revalidate";
    "~*javascript"              "public, max-age=31536000, immutable";
    "~*text/css"                "public, max-age=31536000, immutable";
    "~*image/"                  "public, max-age=2592000";
    "~*font/"                   "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name rrysbekov.ru www.rrysbekov.ru;

    # ACME-проверка сертификата должна работать по http
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://rrysbekov.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.rrysbekov.ru;

    ssl_certificate     /etc/letsencrypt/live/rrysbekov.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rrysbekov.ru/privkey.pem;

    return 301 https://rrysbekov.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rrysbekov.ru;

    root /var/www/rrysbekov/dist;
    index index.html;

    # ---------- TLS ----------
    ssl_certificate     /etc/letsencrypt/live/rrysbekov.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rrysbekov.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---------- Базовая защита ----------
    server_tokens off;
    client_max_body_size 64k;          # сайту статичный, большие тела не нужны
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    limit_conn conn 20;
    limit_req  zone=site burst=20 nodelay;
    limit_req_status 429;
    limit_conn_status 429;

    # ---------- Заголовки безопасности ----------
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://mc.yandex.com https://yastatic.net https://smartcaptcha.yandexcloud.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://mc.yandex.ru https://mc.yandex.com; connect-src 'self' https://api.web3forms.com https://mc.yandex.ru https://mc.yandex.com https://smartcaptcha.yandexcloud.net; frame-src https://smartcaptcha.yandexcloud.net https://mc.yandex.ru; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;

    # ---------- Мусорные боты: рвём соединение без ответа ----------
    if ($bad_bot) { return 444; }

    # ---------- Сканеры уязвимостей ----------
    location ~* /(wp-admin|wp-login|wp-content|wp-includes|wordpress|xmlrpc\.php) { return 444; }
    location ~* /(phpmyadmin|pma|adminer|myadmin|cgi-bin|vendor|telescope|actuator) { return 444; }
    location ~* \.(php|phtml|asp|aspx|jsp|cgi|pl|sql|bak|old|zip|tar|gz|rar|env|ini|log)$ { return 444; }
    location ~ /\.(?!well-known) { return 444; }          # .env, .git, .ssh и прочие точки
    location ~* ^/(src|server|node_modules)/ { return 444; }  # исходники наружу не отдаём

    # ---------- Сжатие ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml application/manifest+json;
    # Если собран ngx_brotli — раскомментировать:
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- API формы: отдельный процесс, отдельный лимит ----------
    location = /api/contact {
        limit_req zone=contact burst=5 nodelay;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
        proxy_send_timeout    15s;
    }

    # ---------- Статика со стабильными хэшами ----------
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /robots.txt   { expires 1d; access_log off; }
    location = /sitemap.xml  { expires 1d; access_log off; }
    location = /favicon.ico  { expires 30d; access_log off; log_not_found off; }

    # ---------- SPA ----------
    # Статика, которой нет, отдаёт честный 404, а не index.html
    location ~* \.(js|mjs|css|png|jpe?g|gif|svg|webp|avif|ico|pdf|woff2?|ttf|eot|map|txt|xml|webmanifest)$ {
        add_header Cache-Control $cache_control always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    error_page 429 /429.html;
    location = /429.html { internal; return 429 "Слишком много запросов. Попробуйте позже.\n"; }
}
